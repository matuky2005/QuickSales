          if(res)send(state.connection,{type:'fire-result',token:data.token,...res});break;
        case 'shot':applyOnlineShot(data);break;
        case 'invalid-fire':state.pendingShot=null;toast('Esa coordenada ya fue atacada. Elegí otra.',true);render();break;
        case 'turn-paused':state.pendingShot=null;toast('Esperá a que termine la animación.',true);render();break;
        case 'player-left':applyPlayerLeft(data);break;
        case 'return-lobby':state.roster=data.roster;state.stage='lobby';render();toast('Esperando otro comandante.',true);break;
        case 'busy':toast('Esta sala ya está llena o ha comenzado.',true);state.stage='online-choose';render();break;
        default:break;
      }
    }
  }
  function installPeer(conn) {
    if(state.host){
      conn.on('open',()=>{
        if(state.stage!=='lobby'||state.roster.length>=state.maxPlayers){send(conn,{type:'busy'});setTimeout(()=>conn.close(),100);return;}
        const slots=Array.from({length:state.maxPlayers},(_,i)=>i);
        const id=slots.find(i=>!state.roster.some(r=>r.id===i));
        if(id===undefined){send(conn,{type:'busy'});conn.close();return;}
        conn.__slot=id;state.connections[id]=conn;
        const name=safeName(conn.metadata?.name,`COMANDANTE ${id+1}`);
        state.roster.push({id,name,ready:false,alive:true,shipsLeft:5});
        state.roster.sort((a,b)=>a.id-b.id);
        send(conn,{type:'welcome',id,maxPlayers:state.maxPlayers,roster:state.roster});
        syncRoster();
        if(state.roster.length===state.maxPlayers)beginFleetPlacement();
      });
      conn.on('data',data=>receiveOnline(data,conn));
      conn.on('close',()=>{if(conn.__slot!==undefined&&state.connections[conn.__slot]===conn)hostDisconnected(conn.__slot);});
      conn.on('error',()=>{if(conn.__slot!==undefined&&state.connections[conn.__slot]===conn)hostDisconnected(conn.__slot);});
    }else{
      state.connection=conn;
      conn.on('data',data=>receiveOnline(data));
      conn.on('close',()=>{if(state.mode==='online'&&state.peer){state.stage='online-choose';state.joining=false;toast('Se perdió la conexión con el anfitrión.',true);render();}});
      conn.on('error',()=>{toast('No se pudo mantener la conexión.',true);});
    }
  }
  function openHostPeer(attempt = 0) {
    if (!state.host || state.stage !== 'lobby' || !window.Peer) return;
    const code = makeRoomCode();
    const peer = new window.Peer(roomPeerId(code));
    state.peer = peer; state.onlineCode = ''; render();
    peer.on('open', id => {
      if (state.peer !== peer) return;
      state.onlineCode = id.startsWith(PEER_PREFIX) ? id.slice(PEER_PREFIX.length) : id;
      render(); toast('Sala lista: compartí el código de seis caracteres.');
    });
    peer.on('connection', conn => { if (state.peer === peer) installPeer(conn); });
    peer.on('error', err => {
      if (state.peer !== peer) return;
      if (err.type === 'unavailable-id' && attempt < 4) {
        try {peer.destroy()} catch (_) {}
        openHostPeer(attempt + 1); return;
      }
      toast(`No se pudo iniciar la sala (${err.type || 'red'}).`, true);
    });
  }
  function hostOnline(){
    const chosen=state.maxPlayers;
    const name=safeName(document.getElementById('host-name')?.value,'COMANDANTE 1');
    resetGame('online');state.maxPlayers=chosen;state.playerName=name;state.host=true;
    state.roster=[{id:0,name,ready:false,alive:true,shipsLeft:5}];
    state.players=Array.from({length:chosen},()=>createPlayer());state.localId=0;
    state.stage='lobby';render();
    if(!window.Peer){toast('PeerJS no está disponible. Revisá tu conexión a Internet.',true);return;}
    openHostPeer();
  }
  function joinOnline(){
    const code=normalizeRoomCode(document.getElementById('room-input')?.value||'');
    if (!SHORT_CODE_RE.test(code) && !/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,179}$/.test(code)) {
      toast('Ingresá un código de 6 caracteres válido.',true);return;
    }
    const name=safeName(document.getElementById('join-name')?.value,'COMANDANTE');
    state.onlineCode=code;state.playerName=name;state.joining=true;render();
    if(!window.Peer){toast('No se cargó PeerJS. Se necesita conexión a Internet.',true);state.joining=false;render();return;}
    if(state.peer)try{state.peer.destroy();}catch(_){}
    const peer=new window.Peer();state.peer=peer;state.host=false;
    peer.on('open',()=>{
      if(state.peer!==peer)return;
      installPeer(peer.connect(roomPeerId(code),{reliable:true,metadata:{name}}));
    });
    peer.on('error',err=>{if(state.peer!==peer)return;state.joining=false;toast(`No se pudo conectar (${err.type||'red'}).`,true);render();});
    state.timerId=setTimeout(()=>{if(state.stage==='join'&&state.joining){state.joining=false;toast('Tiempo de conexión agotado. Verificá el código.',true);render();}},17000);
  }
  function inviteUrl() {
    const url = new URL(window.location.href);
    url.searchParams.set('room', state.onlineCode);
    return url.toString();
  }
  async function copyValue(value, label) {
    try {
      if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(value); toast(`${label} copiado.`); }
      else { window.prompt(`Copiá el ${label.toLowerCase()}:`, value); }
    } catch (_) { window.prompt(`Copiá el ${label.toLowerCase()}:`, value); }
  }
  function actionClick(action, elem) {
    switch (action) {
      case 'menu': openMenu(); break;
      case 'voice': state.voicesOn = !state.voicesOn; try {localStorage.setItem('neptuno-voices', String(state.voicesOn));} catch (_) {}
        if (state.voicesOn) {
          if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) toast('Este navegador no admite voces.', true);
          else say('Narrador activado.');
        } else {try {window.speechSynthesis?.cancel()} catch (_) {}}
        render(); break;
      case 'sound': state.muted = !state.muted; try { localStorage.setItem('neptuno-muted', String(state.muted)); } catch (_) {} sound('click'); render(); break;
      case 'solo': resetGame('solo'); sound('click'); break;
      case 'local': resetGame('local'); sound('click'); break;
      case 'online': state.mode = 'online'; state.stage = 'online-choose'; render(); sound('click'); break;
      case 'host': hostOnline(); sound('click'); break;
      case 'join': state.mode = 'online'; state.stage = 'join'; state.onlineCode = ''; state.joining = false; render(); sound('click'); break;
      case 'connect': joinOnline(); sound('click'); break;
      case 'count': state.maxPlayers = Math.max(2,Math.min(6,Number(elem.dataset.count)||2));
        // Preserve the nickname even if the UI is rerendered.
        state.playerName=safeName(document.getElementById('host-name')?.value,'COMANDANTE');render();sound('click');break;
      case 'target':state.selectedTarget=Number(elem.dataset.id);render();sound('click');break;
      case 'copy-code': if (state.onlineCode) copyValue(state.onlineCode, 'Código'); break;
      case 'copy-link': if (state.onlineCode) copyValue(inviteUrl(), 'Enlace'); break;
      case 'select-ship': state.selected = Number(elem.dataset.index); sound('click'); render(); break;
      case 'rotate': state.vertical = !state.vertical; sound('rotate'); render(); break;
      case 'random': randomFleet(getPlacementPlayer()); state.selected = -1; sound('place'); render(); break;
      case 'clear': { const p = getPlacementPlayer(); p.ships = []; p.occupied = {}; state.selected = 0; sound('click'); render(); break; }
      case 'ready': readyPlacement(); break;
      case 'reveal': state.curtain = false; sound('click'); render(); break;
      case 'again': if (isOnline()) {destroyConnection(); resetGame('online');state.stage = 'online-choose'; render();} else {const m = state.mode; resetGame(m); } break;
      default: break;
    }
  }
  app.addEventListener('click', e => {
    const boardCell = e.target.closest('[data-cell]');
    if (boardCell) {
      if (boardCell.dataset.cell === 'placement' && state.stage === 'placement') {
        const p = getPlacementPlayer();
        let index = state.selected;
        if (index < 0 || p.ships.some(s => s.id === index)) index = nextUnplaced(p);
        if (index < 0) {toast('Ya posicionaste todos los barcos.'); return;}
        const x = Number(boardCell.dataset.x), y = Number(boardCell.dataset.y);
        if (!place(p, index, x, y, state.vertical)) {sound('rotate'); toast('Ese barco no entra en esa posición.', true); return;}
        state.selected = nextUnplaced(p); sound('place'); render(); return;
      }
      if (boardCell.dataset.cell === 'enemy' && state.stage === 'battle') {
        playerShoot(Number(boardCell.dataset.x), Number(boardCell.dataset.y)); return;
      }
    }
    const control = e.target.closest('[data-action]'); if (control) actionClick(control.dataset.action, control);
  });
  app.addEventListener('pointerover', e => {
    if (state.stage !== 'placement' || state.curtain) return;
    const cell = e.target.closest('[data-cell="placement"]');
    if (!cell) return;
    const board = cell.closest('.board');
    board.querySelectorAll('.preview').forEach(c => c.classList.remove('preview', 'invalid'));
    const p = getPlacementPlayer();
    const index = state.selected >= 0 ? state.selected : nextUnplaced(p);
    if (index < 0) return;
    const x = Number(cell.dataset.x), y = Number(cell.dataset.y);
    const valid = canPlace(p, x, y, FLEET[index].size, state.vertical);
    for (let i = 0; i < FLEET[index].size; i++) {
      const cx = x + (state.vertical ? 0 : i), cy = y + (state.vertical ? i : 0);
      if (!inRange(cx, cy)) continue;
      const c = board.children[cy * SIZE + cx];
      if (c) {c.classList.add('preview'); if (!valid) c.classList.add('invalid');}
    }
  });
  app.addEventListener('pointerout', e => {
    if (e.target.closest('.board') && !e.relatedTarget?.closest?.('.board')) {
      e.target.closest('.board').querySelectorAll('.preview').forEach(c => c.classList.remove('preview','invalid'));
    }
  });
  document.querySelector('.site-header').addEventListener('click', e => {const btn = e.target.closest('[data-action]'); if (btn) actionClick(btn.dataset.action, btn);});
  document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r' && state.stage === 'placement' && !state.curtain && !(e.target instanceof HTMLInputElement)) {
      state.vertical = !state.vertical; sound('rotate'); render();
    }
    if (e.key === 'Enter' && state.stage === 'join' && e.target.id === 'room-input') joinOnline();
  });
  window.addEventListener('beforeunload', destroyConnection);
  // Link invites open the join screen and prefill the room code.
  const room = new URLSearchParams(location.search).get('room');
  if (room && /^[a-zA-Z0-9][a-zA-Z0-9_-]{0,179}$/.test(room)) {state.stage = 'join'; state.mode = 'online'; state.onlineCode = normalizeRoomCode(room);}
  render();
  // Minimal hooks for automated browser checks (no gameplay shortcuts in public UI).
  window.__neptunoDebug = {
    getState: () => ({ stage: state.stage, mode: state.mode, turn: state.turn, winner: state.winner,
      ready: [...state.ready], ships: state.players.map(p => p.ships.length), shots: state.players.map(p => Object.keys(p.fired).length),
      localId: state.localId, maxPlayers: state.maxPlayers, roster:state.roster, selectedTarget:state.selectedTarget, pendingShot:state.pendingShot,
      targetShots:state.targetShots,events:state.events,host:state.host,onlineCode:state.onlineCode,voicesOn:state.voicesOn,effectUntil:state.effectUntil,lastEffectId:state.lastEffectId,lastNarration:state.lastNarration }),
  };
})();

</script>
